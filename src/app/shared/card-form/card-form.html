
<!--Carta Reutilizable donde se podra ver un resumen de lo que es un marcador y un poco de la informacion del place.-->
<mat-card appearance="outlined" class="h-full !overflow-hidden !rounded-2xl !border-l-4 !shadow-sm"
  [class.border-l-emerald-500]="isComplete" [class.border-l-amber-500]="!isComplete">
  <mat-card-content class="!flex items-start gap-3 !p-4">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-xl bg-violet-100 text-violet-800" >
      <i [class]="marker.icon" [style.color]="marker.color" aria-hidden="true"></i>
    </span>

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <h3 class="truncate font-semibold text-slate-800">{{ marker.title }}</h3>
        <span class="rounded-full px-2 py-0.5 text-xs font-medium bg-violet-100 text-violet-800" >{{ place.location || "Por Definir" }}</span>
      </div>

      @if (place.description) {
      <p class="mt-1 line-clamp-2 text-sm text-slate-600">{{ place.description }}</p>
      }
      <!--Verificacion de que es lo que le falta -->
      @if (isComplete) {
      <p class="mt-2 flex items-center gap-1 text-xs font-medium text-emerald-700">
        <i class="ri-checkbox-circle-line" aria-hidden="true"></i>
        Información completa
      </p>
      } @else {
      <div class="mt-2">
        <p class="text-xs font-semibold text-amber-700">Pendiente por completar</p>
        <div class="mt-1 flex flex-wrap gap-1">
          @for (field of missingFields; track field) {
          <span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs text-amber-800">{{ field }}</span>
          }
        </div>
      </div>
      }
    </div>


    <button mat-icon-button type="button" aria-label="Editar lugar" title="Editar lugar" class="!text-slate-600"
      (click)="editPlace()">
      <i class="ri-pencil-line" aria-hidden="true"></i>
    </button>

  </mat-card-content>
</mat-card>
